[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsm-toolkit"
version = "0.1.0"
description = "Explicit, provenance-preserving XRD reciprocal-space mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pillow>=9.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
reference = ["xrayutilities>=1.7,<2"]

[project.scripts]
rsm-toolkit = "rsm_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsm_toolkit = ["data/cif/*.cif", "data/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
